<div class="add-container">
  <div class="page-header">
    <button mat-icon-button routerLink="/questions" matTooltip="Back to Questions">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <div>
      <h1>Add Question</h1>
      <p class="subtitle">Fill in all fields to save a new question to the Question Service</p>
    </div>
  </div>

  <mat-card class="form-card">
    <mat-card-content>
      <form [formGroup]="questionForm" (ngSubmit)="onSubmit()">

        <!-- Question text -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Question</mat-label>
          <textarea matInput formControlName="questionTitle" rows="3"
            placeholder="Enter the full question text..."></textarea>
          <mat-error *ngIf="f['questionTitle'].hasError('required')">Question text is required</mat-error>
          <mat-error *ngIf="f['questionTitle'].hasError('minlength')">Minimum 10 characters</mat-error>
        </mat-form-field>

        <!-- Answer options — 2×2 grid -->
        <div class="options-grid">
          <mat-form-field appearance="outline">
            <mat-label>Option A</mat-label>
            <input matInput formControlName="option1" />
            <mat-error *ngIf="f['option1'].hasError('required')">Required</mat-error>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Option B</mat-label>
            <input matInput formControlName="option2" />
            <mat-error *ngIf="f['option2'].hasError('required')">Required</mat-error>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Option C</mat-label>
            <input matInput formControlName="option3" />
            <mat-error *ngIf="f['option3'].hasError('required')">Required</mat-error>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Option D</mat-label>
            <input matInput formControlName="option4" />
            <mat-error *ngIf="f['option4'].hasError('required')">Required</mat-error>
          </mat-form-field>
        </div>

        <!-- Right answer + difficulty + category -->
        <div class="meta-grid">
          <mat-form-field appearance="outline">
            <mat-label>Correct Answer</mat-label>
            <input matInput formControlName="rightAnswer"
              placeholder="Must match one option exactly" />
            <mat-icon matSuffix>check_circle</mat-icon>
            <mat-error *ngIf="f['rightAnswer'].hasError('required')">Required</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Difficulty</mat-label>
            <mat-select formControlName="difficultylevel">
              <mat-option *ngFor="let level of difficultyLevels" [value]="level">
                {{ level }}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Category</mat-label>
            <input matInput formControlName="category" placeholder="e.g. Java, Python, SQL" />
            <mat-icon matSuffix>category</mat-icon>
            <mat-error *ngIf="f['category'].hasError('required')">Required</mat-error>
          </mat-form-field>
        </div>

        <mat-divider></mat-divider>

        <div class="form-actions">
          <button mat-stroked-button type="button" routerLink="/questions">Cancel</button>
          <button mat-raised-button color="primary" type="submit"
            [disabled]="questionForm.invalid">
            <mat-icon>save</mat-icon> Save Question
          </button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
